name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: selftest (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（不依赖测试数据）
        run: python -m compileall -q src tools extract_bilibili.py selftest_subtitle.py

      - name: 离线自检（75 项）
        run: python selftest_subtitle.py
        # 纯离线，不联网、不读 .env、不写用户目录

  no-secrets:
    name: 检查是否误提交凭证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仓库中不允许出现 .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 被提交了，立即移除并吊销密钥"
            exit 1
          fi
          echo "OK: .env 未被跟踪"

      - name: 扫描疑似凭证字符串
        run: |
          set +e
          # 只扫源码，排除 docs/数据；命中即失败
          hits=$(grep -rnE "(SESSDATA|BILI_JCT|SECRET_KEY|ACCESS_KEY|API_KEY)\s*=\s*['\"]?[A-Za-z0-9]{16,}" \
                 --include="*.py" --include="*.md" --include="*.json" --include="*.yml" . \
                 | grep -v "\.env\.example" | grep -v "^\./README.md")
          if [ -n "$hits" ]; then
            echo "::error::疑似硬编码凭证："
            echo "$hits"
            exit 1
          fi
          echo "OK: 源码中未发现硬编码凭证"
